        <h1>
            Images
        </h1>
        <p> This page covers common image formats, but you may also be looking for <a
            href='links.html'>links</a> and <a href='misc/extra.html'>useful
            extras</a>.
        </p>

        <h2>JPGs</h2>
        <p>JPG images are good for photos.</p>
        <img src="images/mochi.jpg" alt="mochi.jpg" width="75">

        <h2>pngs</h2>
        <p>PNG images are good for diagrams and icons.</p>
        <img src="images/mochi.png" alt="mochi.png" width="75">

        <h2>gifs</h2>
        <p>GIF images are good for animations.</p>
        <img src="images/mochi.gif" alt="mochi.gif" width="75">

        <h2>svgs</h2>
        <p>SVG images are <em>amazing</em>.Use them wherever you can</p>
        <img src="images/mochi.svg" alt="mochi.svg">
    </body>
